<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Snake Fullscreen</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
    }

    canvas {
      display: block;
      /* Scale canvas to full screen */
      width: 100vw;
      height: 100vh;
      /* image-rendering: pixelated; */
      /* Keep sharp edges */
    }

    .quiz-option-container {
      background: #A6915A;
      padding: 12px 15px;
      border-radius: 6px;
      cursor: none;
      border: 1px solid #444;
      text-align: left;
    }

    #game-over-popup {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .popup-content {
      background: #A6915A;
      color: white;
      padding: 100px 200px;
      /* width: 50%; */
      /* height: 30%; */
      border-radius: 8px;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    #restart-btn {
      background: #bcae76;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s ease;
      width: 70px;
      height: 40px;
      border: 1px solid #444;
    }
  </style>
</head>

<body>
  <canvas id="viewport" width="640" height="480" tabindex="0"></canvas>

  <div id="game-over-popup" style="display:none;">
    <div class="popup-content">
      <h2>Bạn đã thua!</h2>
      <button id="restart-btn">Chơi lại</button>
    </div>
  </div>

  <div id="quiz-overlay" style="
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.7); color:white; text-align:center; padding-top:150px;
  font-family:Arial, sans-serif;
">
    <div style="
  display:flex; align-items:center; justify-content:center;
        ">

      <div style="
    background:#bcae76; padding:30px 40px; border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
    width:60%; max-width:700px; text-align:center;
  ">
        <h2 id="quiz-question" style="margin-bottom:25px; font-size:22px; line-height:1.4;">
          Question goes here
        </h2>
        <div style="display:flex; flex-direction:column; gap:15px;">
          <div class="quiz-option-container" data-index="0">1. <span class="quiz-option"></span></div>
          <div class="quiz-option-container" data-index="1">2. <span class="quiz-option"></span></div>
          <div class="quiz-option-container" data-index="0">3. <span class="quiz-option"></span></div>
          <div class="quiz-option-container" data-index="0">4. <span class="quiz-option"></span></div>
        </div>
      </div>
    </div>
  </div>
</body>

<script src="snake.js"></script>

</html>
