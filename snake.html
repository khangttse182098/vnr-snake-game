<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Snake Fullscreen</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
    }

    canvas {
      display: block;
      /* Scale canvas to full screen */
      width: 100vw;
      height: 100vh;
      /* image-rendering: pixelated; */
      /* Keep sharp edges */
    }

    quizOption {
      margin: 0 auto,

    }
  </style>
  <script src="snake.js"></script>
</head>

<body>
  <canvas id="viewport" width="640" height="480" tabindex="0"></canvas>

  <div id="quiz-overlay" style="
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.7); color:white; text-align:center; padding-top:150px;
  font-family:Arial, sans-serif;
">
    <h2 id="quiz-question">Question goes here</h2>
    <div
      style="margin-top:20px; height: 20%; width: 50%; display: flex; flex-direction: column; justify-content: space-between;">
      <div data-index="0">1. <span class="quiz-option"></span></div>
      <div data-index="1">2. <span class="quiz-option"></span></div>
      <div data-index="2">3. <span class="quiz-option"></span></div>
      <div data-index="3">4. <span class="quiz-option"></span></div>
    </div>
  </div>
</body>

</html>
